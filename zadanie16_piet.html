<body>
    <div style="color:#00008b;font-size:43px">
    <script language="JavaScript">
        var a=prompt("Podaj pierwszą liczbę A=                                      ","");
        var b=prompt("Podaj drugą liczbę B=  ","");
        var piea;
        var pieb;
        piea=a*a*a;
        dwaa=a*a;
        pieb=b*b*b;
        dwab=b*b;
        suma=piea+3*dwaa*b+3*a*dwab+pieb;
        document.write("("+a+"+"+b+")^3="+a+"^3+3*(("+a+")^2)+3*("+a+")*(("+b+")^2)+"+b+"^3="+piea+"+"+3*dwaa*b+"+"+3*a*dwab+"+"+pieb+"="+suma);
        //a^3   +  3*a^2*b  +  3*a*b^2 + b^3
     </script>

    </div>
