<!DOCTYPE html>   
<head>    
<title>Sprawdzenie danych Twoje nazwisko </title>    
<meta charset="utf-8">   
</head>  
<body> 
<div style="color:red;font-size:50px;"> 
<script language="JavaScript"> 
do { 
var liczba1=prompt("n="," "); 
var n_pie=parseFloat(liczba1); 
} 
while  (n_pie<0);
if(n_pie==0) {
    silnia_pie=1;

}
if(n_pie>0) {
    silnia_pie=1;
    for(i_pie=1;i_pie<-n_pie;i_pie++){
        silnia_pie=silnia_pie*i_pie;
    }
 } document.write("n="+n_pie+"<br>"+n_pie+"!="+silnia_pie);
</script> 
</div> 
</body> 
</html>
